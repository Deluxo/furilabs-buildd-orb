description: >
  Deploy a built flatpak to flatpak.furilabs.io.
parameters:
  arch:
    type: string
    default: amd64
    description: Target architecture
  suite:
    type: string
    default: forky
    description: Suite name for the Docker image tag
  app_id:
    type: string
    description: Flatpak application ID
steps:
  - run:
      name: Flatpak deploy (<<parameters.arch>>)
      no_output_timeout: 10m
      environment:
        PARAM_ARCH: <<parameters.arch>>
        PARAM_SUITE: <<parameters.suite>>
        PARAM_APP_ID: <<parameters.app_id>>
      command: <<include(scripts/flatpak-deploy.sh)>>
